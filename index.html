<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Task 2 - Recipes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-4">
      <h1>Task 2 - Recipes</h1>

      <form class="mb-3">
        <div class="mb-3">
          <label for="searchInput" class="form-label">Search by name:</label>
          <input
            type="text"
            class="form-control"
            id="searchInput"
            placeholder="Enter recipe name"
          />
        </div>
        <label for="difficultySelect" class="form-label"
          >Filter by difficulty:</label
        >
        <select class="form-select mb-3" id="difficultySelect">
          <option value="">All</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>

        <label for="cuisineSelect" class="form-label">Filter by cuisine:</label>
        <select class="form-select mb-3" id="cuisineSelect">
          <option value="">All</option>
        </select>
        <label for="preparationTimeRange" class="form-label">
          Max preparation time: <span id="prepTimeValue">120</span> min
        </label>
        <input
          type="range"
          id="preparationTimeRange"
          min="0"
          max="120"
          step="5"
          value="120"
        />
        <button type="submit" class="btn btn-primary" onclick="applyFilters()">
          Reset Filters
        </button>
      </form>

      <p id="recipeCount"></p>

      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Name</th>
            <th>Cuisine</th>
            <th>Difficulty</th>
            <th>Preparation time</th>
            <th>Rating</th>
            <th>Favorites</th>
          </tr>
        </thead>

        <tbody id="recipeTableBody"></tbody>
      </table>
    </div>

    <script>
      const tableBody = document.getElementById("recipeTableBody");
      let recipes = [];

      fetch("https://dummyjson.com/recipes")
        .then((response) => response.json())
        .then((data) => {
          recipes = data.recipes;
          renderTable(recipes);

          const cuisineSelect = document.getElementById("cuisineSelect");
          const difficultySelect = document.getElementById("difficultySelect");
          const searchInput = document.getElementById("searchInput");
          const preparationTimeRange = document.getElementById(
            "preparationTimeRange",
          );
          const uniqueCuisines = new Set();

          recipes.forEach((recipe) => {
            uniqueCuisines.add(recipe.cuisine);
          });

          uniqueCuisines.forEach((cuisine) => {
            const option = document.createElement("option");
            option.value = cuisine;
            option.textContent = cuisine;
            cuisineSelect.appendChild(option);
          });

          searchInput.addEventListener("input", applyFilters);
          cuisineSelect.addEventListener("change", applyFilters);
          difficultySelect.addEventListener("change", applyFilters);
          preparationTimeRange.addEventListener("input", function () {
            document.getElementById("prepTimeValue").textContent = this.value;
            applyFilters();
          });

          const form = document.querySelector("form");
          form.addEventListener("submit", (event) => {
            applyFilters();
          });
        });

      function renderTable(recipesToDisplay) {
        const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
        tableBody.innerHTML = "";

        recipesToDisplay.forEach((recipe) => {
          const row = document.createElement("tr");
          row.innerHTML = `
                    <td>${recipe.name}</td>
                    <td>${recipe.cuisine}</td>
                    <td>${recipe.difficulty}</td>
                    <td>${recipe.preparationTime}</td>
                    <td>${recipe.rating}</td>
                    <td>
                        <span style="cursor: pointer;" onclick="toggleFavorite(${recipe.id})">
                            ${favorites.includes(recipe.id) ? " ❤️" : "🤍"}
                        </span>
                    </td>
                `;
          tableBody.appendChild(row);
        });
      }

      function applyFilters() {
        const maxPrepTime = Number(
          document.getElementById("preparationTimeRange").value,
        );
        const searchTerm = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const selectedDifficulty =
          document.getElementById("difficultySelect").value;
        const selectedCuisine = document.getElementById("cuisineSelect").value;

        const filteredRecipes = recipes.filter((recipe) => {
          const matchesSearch = recipe.name.toLowerCase().includes(searchTerm);
          const matchesDifficulty =
            selectedDifficulty === "" ||
            recipe.difficulty === selectedDifficulty;
          const matchesCuisine =
            selectedCuisine === "" || recipe.cuisine === selectedCuisine;
          const matchesPrepTime = recipe.prepTimeMinutes <= maxPrepTime;

          return matchesSearch && matchesDifficulty && matchesCuisine && matchesPrepTime;
        });

        renderTable(filteredRecipes);
        const recipeCount = document.getElementById("recipeCount");
        recipeCount.textContent = `Total recipes found: ${filteredRecipes.length}`;
      }

      function toggleFavorite(id) {
        let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

        if (favorites.includes(id)) {
          favorites = favorites.filter((favId) => favId !== id);
        } else {
          favorites.push(id);
        }

        localStorage.setItem("favorites", JSON.stringify(favorites));
        applyFilters();
      }
    </script>
  </body>
</html>
